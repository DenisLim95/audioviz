<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Instrument Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #fff;
            overflow: hidden;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(15, 76, 129, 0.08);
            box-shadow: 0 10px 30px rgba(31, 38, 135, 0.15);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 240px;
        }
        
        #song-info {
            text-align: center;
            margin-bottom: 10px;
        }
        
        #song-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
            color: #000;
        }
        
        #song-artist {
            font-size: 12px;
            color: #a0a0a0;
        }
        
        .controls-row {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 8px 16px;
            background: #e0e0e0;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .back-button {
            background: #c0c0c0;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            color: #1a1a1a;
            box-shadow: 0 8px 20px rgba(31, 38, 135, 0.15);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }
        
        .instrument-legend {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            max-width: 200px;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #000;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            color: #333;
            font-size: 13px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="loading" style="display: none;">
        <h2>Loading visualization data...</h2>
    </div>
    
    <div id="controls">
        <div id="song-info">
            <div id="song-title">Loading...</div>
            <div id="song-artist"></div>
        </div>
        <div class="controls-row">
            <button id="playBtn">Play</button>
            <button id="pauseBtn">Pause</button>
        </div>
        <button class="back-button" onclick="window.location.href='index.html'">← Back to Library</button>
    </div>
    
    <div class="instrument-legend" id="legend" style="display: none;">
        <div class="legend-title">Instruments</div>
        <div id="legend-items"></div>
    </div>
    
    <div id="info">
        Press Play to start
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let audioContext, analyser, dataArray, bufferLength;
        let audioElement, audioSource;
        let visualizationData = null;
        let instrumentMeshes = {};
        let startTime = 0;
        let isPlaying = false;
        
        // Instrument colors
        const INSTRUMENT_COLORS = {
            'piano': 0x667eea,
            'drums': 0xff6b6b,
            'bass': 0x51cf66,
            'guitar': 0xffd93d,
            'synth': 0xa78bfa,
            'strings': 0xfbbf24,
            'brass': 0xf97316,
            'vocals': 0xec4899
        };
        
        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;
            camera.position.y = 10;
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(10, 20, 10);
            scene.add(pointLight);
            
            animate();
        }
        
        function createInstrumentVisualizations() {
            if (!visualizationData || !visualizationData.instruments) {
                console.error('No visualization data loaded');
                return;
            }
            
            const instruments = Object.keys(visualizationData.instruments);
            const spacing = 15;
            const startX = -(instruments.length - 1) * spacing / 2;
            
            const legendItems = document.getElementById('legend-items');
            legendItems.innerHTML = '';
            
            instruments.forEach((instrumentName, index) => {
                const xPos = startX + (index * spacing);
                
                // Get color for instrument
                const color = INSTRUMENT_COLORS[instrumentName.toLowerCase()] || 0xcccccc;
                
                // Create different shapes for different instruments
                let geometry;
                if (instrumentName.toLowerCase().includes('drum')) {
                    geometry = new THREE.BoxGeometry(3, 3, 3);
                } else if (instrumentName.toLowerCase().includes('bass')) {
                    geometry = new THREE.CylinderGeometry(2, 2, 4, 32);
                } else if (instrumentName.toLowerCase().includes('piano') || instrumentName.toLowerCase().includes('key')) {
                    geometry = new THREE.BoxGeometry(4, 1, 2);
                } else {
                    geometry = new THREE.SphereGeometry(2, 32, 32);
                }
                
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(xPos, 0, 0);
                scene.add(mesh);
                
                instrumentMeshes[instrumentName] = {
                    mesh: mesh,
                    baseY: 0,
                    baseScale: 1,
                    color: color
                };
                
                // Add to legend
                const legendItem = document.createElement('div');
                legendItem.className = 'legend-item';
                legendItem.innerHTML = `
                    <div class="legend-color" style="background: #${color.toString(16).padStart(6, '0')}"></div>
                    <span>${instrumentName}</span>
                `;
                legendItems.appendChild(legendItem);
            });
            
            document.getElementById('legend').style.display = 'block';
        }
        
        function updateInstrumentVisuals() {
            if (!isPlaying || !visualizationData) return;
            
            const currentTime = (Date.now() - startTime) / 1000;
            
            Object.keys(instrumentMeshes).forEach(instrumentName => {
                const instrumentData = visualizationData.instruments[instrumentName];
                if (!instrumentData || !instrumentData.timeline) return;
                
                // Find current timeline entry
                const timelineEntry = instrumentData.timeline.find(entry => 
                    Math.abs(entry.time - currentTime) < 0.15
                );
                
                if (timelineEntry && instrumentMeshes[instrumentName]) {
                    const { mesh, baseY, baseScale, color } = instrumentMeshes[instrumentName];
                    const intensity = timelineEntry.intensity;
                    const activeNotes = timelineEntry.active_notes;
                    
                    // Scale based on intensity
                    const scale = baseScale + (intensity * 2);
                    mesh.scale.set(scale, scale, scale);
                    
                    // Move up based on active notes
                    mesh.position.y = baseY + (activeNotes * 0.5);
                    
                    // Rotate based on pitch
                    if (timelineEntry.avg_pitch > 0) {
                        mesh.rotation.y += (timelineEntry.avg_pitch / 127) * 0.05;
                    }
                    
                    // Adjust emissive intensity
                    mesh.material.emissiveIntensity = 0.2 + (intensity * 0.8);
                    
                    // Color shift based on pitch range
                    if (timelineEntry.pitch_range > 10) {
                        const hue = (timelineEntry.avg_pitch / 127);
                        mesh.material.emissive.setHSL(hue, 0.8, 0.5);
                    } else {
                        mesh.material.emissive.set(color);
                    }
                }
            });
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            updateInstrumentVisuals();
            renderer.render(scene, camera);
        }
        
        // Audio handling
        function enforcePitchPreservation(element) {
            element.preservesPitch = true;
            element.mozPreservesPitch = true;
            element.webkitPreservesPitch = true;
        }
        
        async function setupAudio(src) {
            if (audioElement) {
                audioElement.pause();
                audioElement.remove();
            }
            
            if (audioContext) {
                await audioContext.close();
                audioContext = null;
                audioSource = null;
            }
            
            audioElement = new Audio();
            audioElement.crossOrigin = "anonymous";
            audioElement.preload = "auto";
            audioElement.playbackRate = 1.0;
            audioElement.defaultPlaybackRate = 1.0;
            enforcePitchPreservation(audioElement);
            
            audioElement.src = src;
            audioElement.load();
            
            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = false;
        }
        
        function initAudioGraph() {
            if (!audioElement) return;
            if (audioSource) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
            
            audioSource = audioContext.createMediaElementSource(audioElement);
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);
        }
        
        // Load visualization data
        async function loadVisualizationData(audioFileName) {
            const baseName = audioFileName.replace(/\.[^/.]+$/, '').replace('audio/', '');
            const vizDataPath = `viz_data/${baseName}_viz.json`;
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch(vizDataPath);
                if (!response.ok) {
                    throw new Error(`Visualization data not found: ${vizDataPath}`);
                }
                
                visualizationData = await response.json();
                console.log('Loaded visualization data:', visualizationData);
                
                createInstrumentVisualizations();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info').textContent = 'Ready to play';
                
                return true;
            } catch (error) {
                console.error('Error loading visualization data:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info').textContent = 'No MIDI visualization data available';
                return false;
            }
        }
        
        // Load song
        async function loadSong() {
            const urlParams = new URLSearchParams(window.location.search);
            const songFilename = urlParams.get('song');
            const providedTitle = urlParams.get('title');
            
            if (!songFilename) {
                window.location.href = 'index.html';
                return;
            }
            
            const decodedName = decodeURIComponent(songFilename);
            const songPath = decodedName.startsWith('audio/') ? decodedName : `audio/${decodedName}`;
            
            document.getElementById('song-title').textContent = providedTitle
                ? decodeURIComponent(providedTitle)
                : decodedName.replace(/\.[^/.]+$/, '');
            document.getElementById('song-artist').textContent = 'MIDI Visualization';
            
            await setupAudio(songPath);
            await loadVisualizationData(songPath);
        }
        
        // Event listeners
        document.getElementById('playBtn').addEventListener('click', async () => {
            if (!audioElement) return;
            
            try {
                if (audioElement.readyState < 4) {
                    await new Promise((resolve) => {
                        audioElement.addEventListener('canplaythrough', resolve, { once: true });
                        if (audioElement.readyState === 0) {
                            audioElement.load();
                        }
                    });
                }
                
                await new Promise(resolve => setTimeout(resolve, 100));
                
                initAudioGraph();
                
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                
                await new Promise(resolve => setTimeout(resolve, 50));
                
                audioElement.currentTime = 0;
                audioElement.playbackRate = 1.0;
                audioElement.defaultPlaybackRate = 1.0;
                enforcePitchPreservation(audioElement);
                
                await audioElement.play();
                
                startTime = Date.now();
                isPlaying = true;
                
                document.getElementById('info').textContent = 'Playing with MIDI visualization...';
            } catch (err) {
                console.error('Error playing audio', err);
                document.getElementById('info').textContent = 'Unable to play audio';
            }
        });
        
        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (audioElement) {
                audioElement.pause();
                isPlaying = false;
                document.getElementById('info').textContent = 'Paused';
            }
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize
        initScene();
        loadSong();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Audio Visualizer - Song Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1521 0%, #111b2b 100%);
            color: #f5f6f8;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease;
        }
        
        h1 {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #9fb3c8;
            margin-bottom: 30px;
        }
        
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUp 0.8s ease;
        }
        
        .song-row {
            display: grid;
            grid-template-columns: 40px 1fr 120px;
            align-items: center;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(21, 30, 44, 0.9);
            border: 1px solid rgba(95, 180, 249, 0.15);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 12px 30px rgba(3, 6, 12, 0.8);
        }
        
        .song-row:hover {
            background: rgba(30, 44, 63, 0.95);
            transform: translateX(4px);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.65);
        }
        
        .song-row .song-icon {
            font-size: 1.4rem;
            text-align: center;
        }
        
        .song-row .song-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f5f6f8;
        }
        
        .song-row .song-artist {
            color: #8da1bb;
            font-size: 0.9rem;
        }
        
        .song-row .song-meta {
            text-align: right;
            color: #7cc7ff;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .portal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(130, 196, 249, 0.7), rgba(15, 15, 40, 0.9));
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: opacity 0.4s ease;
            z-index: 999;
        }
        
        .portal-overlay::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
        }
        
        .portal-overlay.active {
            animation: portalWarp 0.6s ease forwards;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes portalWarp {
            0% {
                opacity: 0;
                transform: scale(0.8);
                filter: blur(0px);
            }
            50% {
                opacity: 1;
                transform: scale(1);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
                filter: blur(2px);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .song-row {
                grid-template-columns: 30px 1fr 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>playground</h1>
            
        </header>

        <div class="song-list" id="songList">
            <!-- Songs will be populated here -->
        </div>
    </div>
    
    <div class="portal-overlay" id="portalOverlay"></div>

    <script>
        // Define your song library here
        const songs = [
            {
                title: "drunk soul",
                artist: "denis",
                duration: "—",
                filename: "audio/soul*.wav",
                icon: ""
            },
            {
                title: "look ma, no hands 1",
                artist: "denis",
                duration: "—",
                filename: "audio/look-ma-1.wav",
                icon: ""
            },
            {
                title: "look ma, no hands 2",
                artist: "denis",
                duration: "—",
                filename: "audio/look-ma-2.wav",
                icon: ""
            },
            {
                title: "things fall apart",
                artist: "denis",
                duration: "—",
                filename: "audio/things fall apart.wav",
                icon: ""
            },
            {
                title: "not cute anymore remix",
                artist: "denis",
                duration: "—",
                filename: "audio/not cute anymore remix.wav",
                icon: ""
            },
        ];

        const portalOverlay = document.getElementById('portalOverlay');
        const PORTAL_DURATION = 600;
        
        function navigateWithPortal(url) {
            if (portalOverlay) {
                portalOverlay.classList.add('active');
                setTimeout(() => {
                    window.location.href = url;
                }, PORTAL_DURATION);
            } else {
                window.location.href = url;
            }
        }
        
        // Populate song grid
        const songList = document.getElementById('songList');
        songs.forEach(song => {
            const songRow = document.createElement('div');
            songRow.className = 'song-row';
            songRow.innerHTML = `
                <div class="song-icon">${song.icon || '♪'}</div>
                <div>
                    <div class="song-title">${song.title}</div>
                    <div class="song-artist">${song.artist}</div>
                </div>
                <div class="song-meta">${song.duration}</div>
            `;
            
            songRow.addEventListener('click', (e) => {
                const params = new URLSearchParams({
                    song: song.filename,
                    title: song.title
                });
                
                // Check if Shift key is held for MIDI visualizer
                const visualizerPage = e.shiftKey ? 'visualizer-midi.html' : 'visualizer.html';
                navigateWithPortal(`${visualizerPage}?${params.toString()}`);
            });
            
            songList.appendChild(songRow);
        });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
